[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polysolve"
authors = [{name = "", email = "fatih.yaman@stfc.ac.uk"}]
requires-python = ">= 3.8"
readme = "README.md"
description = ""
license = {text = "BSD-3-Clause"}

keywords = ["polytest"]
dependencies = ["numpy"]
classifiers = []
dynamic = ["version"]

[project.urls]
Homepage="https://github.com/FY-Astec/Polytest"
Repository="https://github.com/FY-Astec/Polytest.git"

[tool.setuptools.dynamic]
version = {attr = "polysolve.__version__"}
